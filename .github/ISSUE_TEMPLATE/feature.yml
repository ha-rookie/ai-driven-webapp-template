name: Feature
description: 新機能・改善を設計して実装する
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜ必要か。利用者の事実、問い合わせ、データを記載
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現在の問題
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象・非対象
      placeholder: |
        対象:
        非対象:
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: UI、データ、Security、SEO、Cloudflare、運用
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: テスト観点
    validations:
      required: true
  - type: checkboxes
    id: design
    attributes:
      label: 設計書
      options:
        - label: 設計書更新の要否を判断した
          required: true
        - label: 人間承認前にmainへマージしない
          required: true
